model:
  base_learning_rate: 1.0e-05
  target: ldm.models.diffusion.ddpm.LatentDiffusionSRTextWT
  params:
    linear_start: 0.00085
    linear_end: 0.0120
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: image
    cond_stage_key: caption
    image_size: 256
    channels: 4
    cond_stage_trainable: false
    conditioning_key: crossattn
    monitor: val/loss_simple
    scale_factor: 0.18215
    use_ema: false

    # Supply a public/pretrained StableSR checkpoint. Model weights are loaded
    # without restoring optimizer state.
    ckpt_path: checkpoints/stablesr_base.ckpt

    unfrozen_diff: false
    random_size: false
    paired_input: true
    deterministic_validation: true
    validation_seed: 23
    validation_modalities: [default]
    time_replace: 1000
    use_usm: false
    p2_gamma: null
    p2_k: null

    # These optional paired reconstruction terms are disabled by default.
    # They may be enabled with command-line OmegaConf overrides.
    paired_x0_latent_l1_weight: 0.0
    paired_x0_pixel_l1_weight: 0.0
    paired_x0_gradient_l1_weight: 0.0
    paired_measurement_l2_weight: 0.0
    paired_auxiliary_max_t: 499
    paired_auxiliary_decode_batch_size: 1
    paired_measurement_scale: 4
    paired_measurement_phase_y: 0
    paired_measurement_phase_x: 0

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModelDualcondV2
      params:
        image_size: 32
        in_channels: 4
        out_channels: 4
        model_channels: 320
        attention_resolutions: [4, 2, 1]
        num_res_blocks: 2
        channel_mult: [1, 2, 4, 4]
        num_head_channels: 64
        use_spatial_transformer: true
        use_linear_in_transformer: true
        transformer_depth: 1
        context_dim: 1024
        use_checkpoint: false
        legacy: false
        semb_channels: 256

    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        ckpt_path: weights/stable-diffusion/v2-1_512-ema-pruned.ckpt
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult: [1, 2, 4, 4]
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    cond_stage_config:
      target: ldm.modules.encoders.modules.FrozenOpenCLIPEmbedder
      params:
        version: ""
        freeze: true
        layer: penultimate

    structcond_stage_config:
      target: ldm.modules.diffusionmodules.openaimodel.EncoderUNetModelWT
      params:
        image_size: 32
        in_channels: 4
        model_channels: 256
        out_channels: 256
        num_res_blocks: 2
        attention_resolutions: [4, 2, 1]
        dropout: 0
        channel_mult: [1, 1, 2, 2]
        conv_resample: true
        dims: 2
        use_checkpoint: false
        use_fp16: false
        num_heads: 4
        num_head_channels: -1
        num_heads_upsample: -1
        use_scale_shift_norm: false
        resblock_updown: false
        use_new_attention_order: false

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 4
    num_workers: 2
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
    drop_last: false
    wrap: false
    train:
      target: basicsr.data.grayscale_swinir_paired_dataset.AFMMultimodalSwinIRPairedDataset
      params:
        dataroot_lq: datasets/afm_swinir
        dataroot_gt: datasets/afm_gt
        phase: train
        crop_size: 256
        modalities: [default]
    validation:
      target: basicsr.data.grayscale_swinir_paired_dataset.AFMMultimodalSwinIRPairedDataset
      params:
        dataroot_lq: datasets/afm_swinir
        dataroot_gt: datasets/afm_gt
        phase: val
        crop_size: 256
        modalities: [default]
    test:
      target: basicsr.data.grayscale_swinir_paired_dataset.AFMMultimodalSwinIRPairedDataset
      params:
        dataroot_lq: datasets/afm_swinir
        dataroot_gt: datasets/afm_gt
        phase: test
        crop_size: 256
        modalities: [default]

lightning:
  logger:
    target: pytorch_lightning.loggers.WandbLogger
    params:
      offline: true
      project: stableafm
  modelcheckpoint:
    params:
      every_n_epochs: 5
      save_top_k: 3
      save_last: true
      mode: min
  callbacks:
    best_checkpoint_link:
      target: main.BestCheckpointLinkCallback
      params:
        filename: best.ckpt
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 250
        max_images: 4
        increase_log_steps: false
        log_images_kwargs:
          sample: false
          plot_diffusion_rows: false
          plot_denoise_rows: false
          plot_progressive_rows: false
  trainer:
    benchmark: true
    max_epochs: 100
    check_val_every_n_epoch: 5
    accumulate_grad_batches: 1
    precision: 32
    num_sanity_val_steps: 0
